name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

  supabase:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply schema and deploy functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ] || [ -z "${SUPABASE_PROJECT_REF}" ]; then
            echo "Skipping Supabase sync (set SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF)."
            exit 0
          fi
          npx --yes supabase@latest db push --project-ref "$SUPABASE_PROJECT_REF" --yes --include-all
          npx --yes supabase@latest functions deploy kontakt --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          npx --yes supabase@latest functions deploy pretplata --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          npx --yes supabase@latest functions deploy obavijesti-notify --project-ref "$SUPABASE_PROJECT_REF"
          if [ -n "${BREVO_API_KEY}" ]; then
            npx --yes supabase@latest secrets set BREVO_API_KEY="$BREVO_API_KEY" --project-ref "$SUPABASE_PROJECT_REF"
          fi
          if [ -n "${SITE_URL}" ]; then
            npx --yes supabase@latest secrets set SITE_URL="$SITE_URL" --project-ref "$SUPABASE_PROJECT_REF"
          fi
